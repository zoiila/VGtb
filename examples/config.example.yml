# Vgtb — public configuration example (partial)
# This is a curated reference, NOT a complete drop-in config.yml.
# Edit only corresponding keys in the config.yml generated by your licensed build.
# Defaults and supported keys can vary by version. Preserve existing custom values.
# No arena coordinates, secrets, premium pack hashes or private identifiers are included.

config-version: 2

game:
  min-players: 2
  max-players: 16
  queue:
    capacities: [4, 6, 8, 16]
    default-capacity: 4
    start-fill-percent: 75
  countdown: 15
  choose-time: 15
  build-time: 100
  reveal-time: 7
  ending-time: 12
  theme-options: 3
  guess-points: [3, 2, 1]
  builder-points: 1
  hint-fractions: [0.35, 0.55, 0.75]

arena:
  reset-enabled: true
  default-plot:
    width: 21
    depth: 21
    height: 16

ui:
  text: '#F4F0E8'
  accent: '#EFA8D8'
  gold: '#F08AB5'
  value: '#7DD3C7'
  muted: '#ADB5BD'
  scoreboard: true
  bossbar: true
  actionbar: true
  titles: true

# Safe demonstration value: do not claim a premium sound pack is ready.
audio:
  provider: silent

# Arena locations and saved world data are intentionally excluded.
