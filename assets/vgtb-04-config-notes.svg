<text x="222" y="315" fill="#FFFDF6" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="620" >arena-setup / administrator</text>
<text x="129" y="389" fill="#192D42" font-family="Consolas,Menlo,monospace" font-size="27" font-weight="650" >/gb setwaiting &lt;arena&gt;</text><path d="M127 406H891" fill="none" stroke="#DFE7E1" stroke-width="1" /><text x="129" y="453" fill="#192D42" font-family="Consolas,Menlo,monospace" font-size="27" font-weight="650" >/gb setlobby &lt;arena&gt;</text><path d="M127 470H891" fill="none" stroke="#DFE7E1" stroke-width="1" /><text x="129" y="517" fill="#192D42" font-family="Consolas,Menlo,monospace" font-size="27" font-weight="650" >/gb setgame &lt;arena&gt;</text><path d="M127 534H891" fill="none" stroke="#DFE7E1" stroke-width="1" /><text x="129" y="581" fill="#192D42" font-family="Consolas,Menlo,monospace" font-size="27" font-weight="650" >/gb setspectator &lt;arena&gt;</text><path d="M127 598H891" fill="none" stroke="#DFE7E1" stroke-width="1" /><text x="129" y="645" fill="#315B87" font-family="Consolas,Menlo,monospace" font-size="27" font-weight="650" >/gb setpos1 &lt;arena&gt;</text><path d="M127 662H891" fill="none" stroke="#DFE7E1" stroke-width="1" /><text x="129" y="709" fill="#315B87" font-family="Consolas,Menlo,monospace" font-size="27" font-weight="650" >/gb setpos2 &lt;arena&gt;</text><path d="M127 726H891" fill="none" stroke="#DFE7E1" stroke-width="1" />
<text x="1008" y="313" fill="#192D42" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="830" letter-spacing="1.5">DON'T SKIP THESE</text>
<circle cx="1028" cy="355" r="24" fill="#F3D45F"/><text x="1013" y="363" fill="#192D42" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="800" >01</text><text x="1071" y="363" fill="#192D42" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="760" >Set all four spawn points</text><text x="1072" y="399" fill="#315B87" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="540" >Waiting, lobby, game, spectator.</text><path d="M1008 435H1592" fill="none" stroke="#9EBDB4" stroke-width="2" /><circle cx="1028" cy="487" r="24" fill="#BCE4C8"/><text x="1013" y="495" fill="#192D42" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="800" >02</text><text x="1071" y="495" fill="#192D42" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="760" >Define both corners</text><text x="1072" y="531" fill="#315B87" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="540" >Use setpos1 and setpos2.</text><path d="M1008 567H1592" fill="none" stroke="#9EBDB4" stroke-width="2" /><circle cx="1028" cy="619" r="24" fill="#E36B55"/><text x="1013" y="627" fill="#192D42" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="800" >03</text><text x="1071" y="627" fill="#192D42" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="760" >Test before opening</text><text x="1072" y="663" fill="#315B87" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="540" >Check positions and boundaries.</text><path d="M1008 699H1592" fill="none" stroke="#9EBDB4" stroke-width="2" />
