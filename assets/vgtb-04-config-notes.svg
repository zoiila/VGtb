<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 840" width="1680" height="840" role="img"><title>Vgtb arena setup and practical tips</title><g transform="rotate(0.9 840 428)"><rect x="135" y="120" width="1418" height="669" rx="8" fill="#03060C" opacity=".45"/><rect x="124" y="109" width="1429" height="669" rx="7" fill="#352C4D" opacity=".78"/><rect x="112" y="93" width="1429" height="669" rx="5" fill="#1B202A" stroke="#454A5B" stroke-width="2"/><path d="M112 93H1541" stroke="#B8A0EA" stroke-width="2.5" opacity=".65"/><text x="194" y="172" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="750" letter-spacing="2">04  /  ARENA PREPARATION</text><text x="192" y="265" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="70" font-weight="730" letter-spacing="-2">Prepare every arena.</text><text x="196" y="310" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="450">Safe spawn points, clear build bounds, reliable round flow.</text><path d="M195 348H1434" fill="none" stroke="#4B5263" stroke-width="1.5" opacity="1"/><text x="218" y="398" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="680" letter-spacing="1.3">WORLD SETUP</text><text x="580" y="401" fill="#8BD8D4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" font-weight="620" letter-spacing="-0.5">Existing world</text><text x="581" y="430" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="430">Prepare your own world and play space.</text><path d="M215 440H1020" fill="none" stroke="#4B5263" stroke-width="1.3" opacity="0.7"/><text x="218" y="479" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="680" letter-spacing="1.3">PLAYER SPAWNS</text><text x="580" y="482" fill="#8BD8D4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" font-weight="620" letter-spacing="-0.5">Separate locations</text><text x="581" y="509" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="430">Waiting, lobby, game and spectator areas.</text><path d="M215 521H1020" fill="none" stroke="#4B5263" stroke-width="1.3" opacity="0.7"/><text x="218" y="560" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="680" letter-spacing="1.3">BUILD AREA</text><text x="580" y="563" fill="#8BD8D4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="28" font-weight="620" letter-spacing="-0.5">Clear boundaries</text><text x="581" y="590" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="430">Keep the intended building space contained.</text><path d="M215 602H1020" fill="none" stroke="#4B5263" stroke-width="1.3" opacity="0.7"/><text x="218" y="643" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="680" letter-spacing="1.3">MATCH FLOW</text><text x="580" y="646" fill="#8BD8D4" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="620" letter-spacing="-0.5">Safe return path</text><text x="581" y="673" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="430">Check how players leave and rejoin the lobby.</text><path d="M215 685H1020" fill="none" stroke="#4B5263" stroke-width="1.3" opacity="0.7"/><path d="M1066 378V694" stroke="#4B5263" stroke-width="1.6"/><text x="1106" y="401" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="720" letter-spacing="1.5">ADMIN CHECKLIST</text><text x="1105" y="454" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" font-weight="650">Safe player arrivals</text><text x="1106" y="483" fill="#F3C980" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="470">Avoid walls, drops and hazards.</text><path d="M1106 514H1437" fill="none" stroke="#4B5263" stroke-width="1.5" opacity="1"/><text x="1105" y="566" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="650">Spectator spacing</text><text x="1106" y="598" fill="#F3C980" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="470">Keep viewers clear of the build.</text><text x="1106" y="645" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="650">Full match test</text><text x="1106" y="671" fill="#A7B0BE" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="450">Verify spawns, bounds and returns.</text><path d="M1106 617H1437" fill="none" stroke="#4B5263" stroke-width="1.5"/><path d="M195 715H1434" fill="none" stroke="#4B5263" stroke-width="1.6" opacity="0.75"/><text x="196" y="752" fill="#A7B0BE" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="650" letter-spacing="1">SIX MANUAL ARENAS  /  SAFE SPAWNS  /  CLEAR BOUNDS  /  SMOOTH ROUNDS</text></g><image x="1362" y="9" width="145" height="99" href="data:image/png;base64,"/></svg>