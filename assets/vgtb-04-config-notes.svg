<text x="233" y="486" font-family="Consolas,Menlo,monospace" fill="#7BCFBE" font-size="24" font-weight="620">/gb setwaiting &lt;arena&gt;</text><text x="233" y="543" font-family="Consolas,Menlo,monospace" fill="#F8F7FC" font-size="24" font-weight="620">/gb setlobby &lt;arena&gt;</text><text x="233" y="600" font-family="Consolas,Menlo,monospace" fill="#F8F7FC" font-size="24" font-weight="620">/gb setgame &lt;arena&gt;</text><text x="233" y="657" font-family="Consolas,Menlo,monospace" fill="#F8F7FC" font-size="24" font-weight="620">/gb setspectator &lt;arena&gt;</text><text x="233" y="714" font-family="Consolas,Menlo,monospace" fill="#B8A0EA" font-size="24" font-weight="620">/gb setpos1 &lt;arena&gt;</text><text x="233" y="771" font-family="Consolas,Menlo,monospace" fill="#B8A0EA" font-size="24" font-weight="620">/gb setpos2 &lt;arena&gt;</text>
