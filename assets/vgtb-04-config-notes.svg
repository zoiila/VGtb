<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 840" width="1680" height="840" role="img"><title>Configure Vgtb arenas. — Vgtb by VACK Studio</title><g transform="rotate(0.9 840 428)"><rect x="135" y="120" width="1418" height="669" rx="8" fill="#03060C" opacity=".45"/><rect x="124" y="109" width="1429" height="669" rx="7" fill="#352C4D" opacity=".78"/><rect x="112" y="93" width="1429" height="669" rx="5" fill="#1B202A" stroke="#454A5B" stroke-width="2"/><path d="M112 93H1541" stroke="#B8A0EA" stroke-width="2.5" opacity=".65"/><text x="194" y="172" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="750" letter-spacing="2">04  /  CONFIGURATION &amp; TIPS</text><text x="192" y="265" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="66" font-weight="730" letter-spacing="-2">Configure Vgtb arenas.</text><text x="196" y="310" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="450">Manually positioned arenas, accurate bounds, and useful commands.</text><path d="M195 348H1434" fill="none" stroke="#4B5263" stroke-width="1.5" opacity="1"/><text x="218" y="398" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="680" letter-spacing="1.3">WAITING</text><text x="580" y="401" fill="#7BCFBE" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="620" letter-spacing="-0.5">/gb setwaiting &lt;arena&gt;</text><path d="M215 440H1020" fill="none" stroke="#4B5263" stroke-width="1.3" opacity="0.7"/><text x="218" y="479" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="680" letter-spacing="1.3">LOBBY</text><text x="580" y="482" fill="#E8BF83" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="620" letter-spacing="-0.5">/gb setlobby &lt;arena&gt;</text><text x="581" y="509" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="430">Set each arena's lobby position</text><path d="M215 521H1020" fill="none" stroke="#4B5263" stroke-width="1.3" opacity="0.7"/><text x="218" y="560" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="680" letter-spacing="1.3">GAME</text><text x="580" y="563" fill="#7BAFE7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="620" letter-spacing="-0.5">/gb setgame &lt;arena&gt;</text><path d="M215 602H1020" fill="none" stroke="#4B5263" stroke-width="1.3" opacity="0.7"/><text x="218" y="643" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="680" letter-spacing="1.3">SPECTATOR</text><text x="580" y="646" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="620" letter-spacing="-0.5">/gb setspectator &lt;arena&gt;</text><text x="581" y="673" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="430">Also set /gb setpos1 and /gb setpos2</text><path d="M215 685H1020" fill="none" stroke="#4B5263" stroke-width="1.3" opacity="0.7"/><path d="M1066 378V694" stroke="#4B5263" stroke-width="1.6"/><text x="1106" y="401" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="720" letter-spacing="1.5">BEFORE OPENING</text><text x="1105" y="454" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" font-weight="650">Play-area bounds</text><text x="1106" y="483" fill="#7BCFBE" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="470">Set both corners</text><path d="M1106 514H1437" fill="none" stroke="#4B5263" stroke-width="1.5" opacity="1"/><text x="1105" y="566" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="650">Spawn locations</text><text x="1106" y="598" fill="#E8BF83" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="470">Verify all four</text><text x="1106"