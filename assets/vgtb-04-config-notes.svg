<text x="998" y="455" font-family="Inter,Arial,Helvetica,sans-serif" fill="#7BCFBE" font-weight="800" font-size="25" >01</text><text x="1053" y="455" font-family="Inter,Arial,Helvetica,sans-serif" fill="#F8F7FC" font-weight="665" font-size="22" >Define all four spawn points.</text><text x="1053" y="489" font-family="Inter,Arial,Helvetica,sans-serif" fill="#AEB8C7" font-weight="490" font-size="19" >Waiting, lobby, game and spectator.</text><path d="M1000 505H1445" fill="none" stroke="#4C5466" stroke-width="1" /><text x="998" y="565" font-family="Inter,Arial,Helvetica,sans-serif" fill="#7BCFBE" font-weight="800" font-size="25" >02</text><text x="1053" y="565" font-family="Inter,Arial,Helvetica,sans-serif" fill="#F8F7FC" font-weight="665" font-size="22" >Mark both area corners.</text><text x="1053" y="599" font-family="Inter,Arial,Helvetica,sans-serif" fill="#AEB8C7" font-weight="490" font-size="19" >Set position 1 and position 2.</text><path d="M1000 615H1445" fill="none" stroke="#4C5466" stroke-width="1" /><text x="998" y="675" font-family="Inter,Arial,Helvetica,sans-serif" fill="#7BCFBE" font-weight="800" font-size="25" >03</text><text x="1053" y="675" font-family="Inter,Arial,Helvetica,sans-serif" fill="#F8F7FC" font-weight="665" font-size="22" >Test the arena first.</text><text x="1053" y="709" font-family="Inter,Arial,Helvetica,sans-serif" fill="#AEB8C7" font-weight="490" font-size="19" >Administrator access: gb.admin.</text><path d="M1000 725H1445" fill="none" stroke="#4C5466" stroke-width="1" />
