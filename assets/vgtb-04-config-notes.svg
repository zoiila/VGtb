<text x="96" y="101" fill="#315B87" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="810" letter-spacing="3">04  /  THE FIELD GUIDE</text>
<text x="90" y="187" fill="#192D42" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="850" letter-spacing="-3">Make the arena yours.</text>
<text x="92" y="237" fill="#315B87" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="580" >Existing Minecraft worlds. Your positions. Six manual arenas.</text>
