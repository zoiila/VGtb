<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 840" width="1680" height="840" role="img"><title>One builder. Many guesses. — Vgtb by VACK STUDIO</title><g transform="rotate(1.1 840 428)"><rect x="135" y="120" width="1418" height="669" rx="8" fill="#03060C" opacity=".45"/><rect x="124" y="109" width="1429" height="669" rx="7" fill="#352C4D" opacity=".78"/><rect x="112" y="93" width="1429" height="669" rx="5" fill="#1B202A" stroke="#454A5B" stroke-width="2"/><path d="M112 93H1541" stroke="#B8A0EA" stroke-width="2.5" opacity=".65"/><text x="194" y="172" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="750" letter-spacing="2">02  /  THE MINIGAME</text><text x="192" y="265" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="63" font-weight="730" letter-spacing="-2">Build the clue. Guess the word.</text><text x="196" y="310" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="450">A rotating builder creates clues while everyone else guesses in chat.</text><path d="M195 348H1434" fill="none" stroke="#4B5263" stroke-width="1.5" opacity="1"/><rect x="196" y="389" width="1238" height="104" rx="1" fill="#161C27" opacity=".75"/><text x="219" y="423" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="680" letter-spacing="1.5">01</text><text x="273" y="426" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="720" letter-spacing="-0.3">Choose an arena</text><text x="666" y="426" fill="#B7C1D0" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="650" letter-spacing="-0.6">4 / 6 / 8 / 16</text><text x="1193" y="426" fill="#7BCFBE" font-family="Inter,Arial,Helvetica,sans-serif" font-size="24" font-weight="680" letter-spacing="-0.5">Six arenas</text><text x="273" y="460" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="440">Join directly or queue</text><text x="666" y="460" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="440">Player capacities</text><text x="1193" y="460" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="450">Existing worlds</text><path d="M198 498H1432" fill="none" stroke="#4B5263" stroke-width="1.4" opacity="0.7"/><path d="M610 419h24l-7-7m7 7-7 7" fill="none" stroke="#B8A0EA" stroke-width="2.5" opacity=".8"/><rect x="196" y="508" width="1238" height="104" rx="1" fill="#161C27" opacity=".75"/><text x="219" y="542" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="680" letter-spacing="1.5">02</text><text x="273" y="545" fill="#E8BF83" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="720" letter-spacing="-0.3">Builder's turn</text><text x="666" y="545" fill="#7BAFE7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="650" letter-spacing="-0.6">Theme selection</text><text x="1193" y="545" fill="#E8BF83" font-family="Inter,Arial,Helvetica,sans-serif" font-size="24" font-weight="680" letter-spacing="-0.5">Timed choice</text><text x="273" y="579" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="440">One builder at a time</text><text x="666" y="579" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="440">Pick a theme</text><text x="1193" y="579" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="450">Then start building</text><path d="M198 617H1432" fill="none" stroke="#4B5263" stroke-width="1.4" opacity="0.7"/><path d="M610 538h24l-7-7m7 7-7 7" fill="none" stroke="#B8A0EA" stroke-width="2.5" opacity=".8"/><rect x="196" y="627" width="1238" height="104" rx="1" fill="#161C27" opacity=".75"/><text x="219" y="661" fill="#B8A0EA" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="680" letter-spacing="1.5">03</text><text x="273" y="664" fill="#7BCFBE" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="720" letter-spacing="-0.3">Build and guess</text><text x="666" y="664" fill="#7BCFBE" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="650" letter-spacing="-0.6">Hints and scores</text><text x="1193" y="664" fill="#7BCFBE" font-family="Inter,Arial,Helvetica,sans-serif" font-size="24" font-weight="680" letter-spacing="-0.5">Next builder</text><text x="273" y="698" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="440">Answers go in chat</text><text x="666" y="698" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="440">Points for correct guesses</text><text x="1193" y="698" fill="#AEB8C7" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="450">Turns rotate</text><path d="M198 736H1432" fill="none" stroke="#4B5263" stroke-width="1.4" opacity="0.7"/><path d="M610 657h24l-7-7m7 7-7 7" fill="none" stroke="#B8A0EA" stroke-width="2.5" opacity=".8"/><path d="M195 715H1434" fill="none" stroke="#4B5263" stroke-width="1.6" opacity="0.75"/><text x="196" y="752" fill="#A7B0BE" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="650" letter-spacing="1">ARENA QUEUE  /  BUILDER TURNS  /  THEME CHOICE  /  HINTS  /  SCORING</text></g><image x="1350" y="23" width="157" height="88" href="data:image/png;base64,"/></svg>