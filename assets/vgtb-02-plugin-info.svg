<text x="87" y="95" fill="#F3D45F" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="810" letter-spacing="3">02  /  THE IDEA</text>
<text x="86" y="186" fill="#FFFDF6" font-family="Arial,Helvetica,sans-serif" font-size="81" font-weight="850" letter-spacing="-2.8">One player builds.</text>
<text x="86" y="267" fill="#BCE4C8" font-family="Arial,Helvetica,sans-serif" font-size="81" font-weight="850" letter-spacing="-2.9">Everyone else guesses.</text>
<text x="91" y="323" fill="#EFE8D9" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="520" >A simple idea. A surprisingly competitive game.</text>
